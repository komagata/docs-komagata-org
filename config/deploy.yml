# Kamal deployment configuration for Lokka CMS
# See https://kamal-deploy.org/docs/configuration/ for details

service: lokka

image: komagata/lokka

servers:
  web:
    hosts:
      - 133.125.55.80

proxy:
  ssl: true
  host: docs.komagata.org
  app_port: 3000
  healthcheck:
    path: /

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RACK_ENV: production
    WEB_CONCURRENCY: 2
    DATABASE_URL: sqlite3:///app/db/production.sqlite3
  secret:
    - SECRET_KEY_BASE

volumes:
  - "lokka_db:/app/db"
  - "lokka_uploads:/app/public/uploads"

ssh:
  user: ubuntu
  keys:
    - ~/.ssh/id_ed25519

builder:
  arch: amd64
